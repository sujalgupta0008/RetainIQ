# Render Blueprint: RetainIQ API + Postgres.
# Deploy: Render dashboard -> New -> Blueprint -> select this repo.
# Then set the secrets below (JWT_SECRET auto-generates, GOOGLE_CLIENT_ID optional).
services:
  - type: web
    name: retainiq-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: RETAINIQ_ENV
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: retainiq-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://retainiq-frontend-seven.vercel.app
      - key: SEED
        value: "42"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: retainiq-db
    databaseName: retainiq
    user: retainiq
    plan: free
